<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F1FF" id="metaTheme">

<!-- Защита: разрешаем грузить файлы только с проверенных адресов -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://telegram.org;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: https:;
  connect-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'none';
  frame-ancestors https://web.telegram.org https://*.telegram.org;
">
<meta name="referrer" content="no-referrer">

<title>ASTALAVISTA — букинг моделей и промо-персонала</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Onest:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Ставим сохранённую тему ДО того, как страница нарисуется.
     Иначе при открытии на секунду мигнёт белым. -->
<script>
(function(){
  try{
    var t = localStorage.getItem('asta_theme');
    if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.setAttribute('data-theme', 'light');
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>

<style>
/* ══════════════════════════════════════════════════════════════
   ПУНКТ 1 · ЦВЕТА СВЕТЛОЙ ТЕМЫ
   Меняете цвет здесь — он меняется во всём приложении сразу.
   Цвет пишется кодом вида #RRGGBB. Подобрать можно на coolors.co
   ══════════════════════════════════════════════════════════════ */
:root, html[data-theme="light"]{
  --bg:        #F4F1FF;   /* цвет фона */
  --blob-1:    #A78BFA;   /* цветное пятно на фоне: фиолетовое */
  --blob-2:    #5EEAD4;   /* цветное пятно на фоне: бирюзовое */
  --blob-3:    #FDA4D4;   /* цветное пятно на фоне: розовое */
  --blob-op:   .62;       /* насколько яркие пятна: 0 = невидимые, 1 = максимум */

  --card:      rgba(255,255,255,.74);  /* фон карточек */
  --card-2:    rgba(255,255,255,.90);
  --panel:     rgba(255,255,255,.97);  /* фон выезжающих панелей */
  --stroke:    rgba(124,92,240,.16);   /* цвет рамок */
  --stroke-2:  rgba(124,92,240,.32);

  --violet:    #7C5CF0;   /* главный акцент: кнопки, ссылки */
  --mint:      #14B8A6;   /* второй акцент */
  --rose:      #EC4899;   /* кнопка «Забронировать» */
  --star:      #F59E0B;   /* цвет звёздочек в отзывах */

  --txt:       #241F42;   /* основной текст */
  --txt-2:     #5F5A85;   /* текст помельче */
  --txt-3:     #8F8AB2;   /* серые подписи */

  --ph-txt:    rgba(255,255,255,.92);  /* инициалы на заглушке фото */

  --sh-s: 0 4px 16px rgba(124,92,240,.12);
  --sh-m: 0 10px 34px rgba(124,92,240,.16);
  --sh-l: 0 24px 60px rgba(124,92,240,.22);
}

/* ══════════════════════════════════════════════════════════════
   ПУНКТ 1.1 · ЦВЕТА ТЁМНОЙ ТЕМЫ
   Работает точно так же, только для ночного режима.
   ══════════════════════════════════════════════════════════════ */
html[data-theme="dark"]{
  --bg:        #0F0D1F;
  --blob-1:    #6D4BE8;
  --blob-2:    #0E9488;
  --blob-3:    #C0327C;
  --blob-op:   .48;

  --card:      rgba(255,255,255,.055);
  --card-2:    rgba(255,255,255,.085);
  --panel:     rgba(26,23,48,.98);
  --stroke:    rgba(255,255,255,.12);
  --stroke-2:  rgba(255,255,255,.24);

  --violet:    #9D82FF;
  --mint:      #2DD4BF;
  --rose:      #F472B6;
  --star:      #FBBF24;

  --txt:       #F2F0FA;
  --txt-2:     #ABA6CB;
  --txt-3:     #7B76A0;

  --ph-txt:    rgba(255,255,255,.88);

  --sh-s: 0 4px 16px rgba(0,0,0,.4);
  --sh-m: 0 10px 34px rgba(0,0,0,.5);
  --sh-l: 0 24px 60px rgba(0,0,0,.6);
}

/* ---- Размеры и шрифты. Обычно менять не нужно ---- */
:root{
  --r-s:14px; --r-m:20px; --r-l:28px;
  --pad:16px;
  --safe-top:0px; --safe-bottom:0px;
  --f-display:'Unbounded',system-ui,sans-serif;
  --f-body:'Onest','Manrope',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--f-body);
  font-size:16px;          /* ← ОБЩИЙ РАЗМЕР ТЕКСТА. Больше цифра — крупнее весь текст */
  line-height:1.6;
  overflow-x:hidden;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
}
body.locked{overflow:hidden}

.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura i{position:absolute;display:block;border-radius:50%;filter:blur(85px);opacity:var(--blob-op);transition:opacity .35s ease}
.aura i:nth-child(1){width:66vw;height:66vw;top:-24vw;left:-20vw;background:radial-gradient(circle,var(--blob-1),transparent 70%);animation:drift 26s var(--ease) infinite alternate}
.aura i:nth-child(2){width:58vw;height:58vw;top:28vh;right:-26vw;background:radial-gradient(circle,var(--blob-2),transparent 70%);animation:drift 32s var(--ease) infinite alternate-reverse}
.aura i:nth-child(3){width:52vw;height:52vw;bottom:-18vh;left:8vw;background:radial-gradient(circle,var(--blob-3),transparent 70%);animation:drift 38s var(--ease) infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(7vw,-6vh,0) scale(1.2)}}

.shell{position:relative;z-index:2;min-height:100%;max-width:1280px;margin:0 auto;padding-bottom:calc(44px + var(--safe-bottom))}

/* ---------- Шапка ---------- */
.hdr{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-top) + 12px) var(--pad) 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--bg);
  backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  border-bottom:1px solid var(--stroke);
  transition:background .35s ease,border-color .35s ease;
}
.hdr .side{display:flex;gap:8px;align-items:center}
.brand{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;pointer-events:none}
.mark{width:30px;height:30px;flex:none;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,var(--violet),var(--mint));box-shadow:0 6px 18px rgba(124,92,240,.35)}
.mark svg{width:16px;height:16px}
.brand h1{
  font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.1em;line-height:1;white-space:nowrap;
  background:linear-gradient(100deg,var(--violet),var(--mint));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
@media(max-width:359px){.brand h1{font-size:12px}.mark{display:none}}

.ico{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--stroke);color:var(--txt-2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:var(--sh-s);cursor:pointer;position:relative;
  transition:transform .2s var(--ease),color .2s,border-color .2s,background .2s;
}
.ico:active{transform:scale(.9)}
.ico svg{width:18px;height:18px}
.ico.on{color:#fff;border-color:transparent;background:linear-gradient(140deg,var(--rose),var(--violet))}
.ico .dot{position:absolute;top:4px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--rose);color:#fff;font-size:10px;font-weight:700;line-height:17px;text-align:center;border:2px solid var(--bg)}
.ico .dot[hidden]{display:none}

/* ---------- Поиск ---------- */
.tools{padding:14px var(--pad) 0;display:flex;gap:10px}
.search{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--stroke);border-radius:17px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh-s);transition:border-color .25s}
.search:focus-within{border-color:var(--stroke-2)}
.search svg{width:18px;height:18px;color:var(--txt-3);margin-left:14px;flex:none}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-family:var(--f-body);font-size:15px;padding:14px 12px;min-width:0}
.search input::placeholder{color:var(--txt-3)}
.search .clr{width:30px;height:30px;margin-right:7px;border:0;background:var(--stroke);border-radius:50%;color:var(--txt-2);display:none;place-items:center;cursor:pointer;flex:none;font-size:16px;line-height:1}
.search.filled .clr{display:grid}

.fbtn{position:relative;flex:none;width:52px;border-radius:17px;border:0;cursor:pointer;background:linear-gradient(145deg,var(--violet),var(--mint));color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(124,92,240,.35);transition:transform .2s var(--ease)}
.fbtn:active{transform:scale(.93)}
.fbtn svg{width:20px;height:20px}
.fbtn .badge{position:absolute;top:5px;right:5px;min-width:18px;height:18px;border-radius:9px;padding:0 4px;background:#fff;color:var(--violet);font-size:10px;font-weight:800;line-height:18px;text-align:center}
.fbtn .badge[hidden]{display:none}

/* ---------- Быстрые кнопки ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px var(--pad) 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;cursor:pointer;white-space:nowrap;background:var(--card);border:1px solid var(--stroke);color:var(--txt-2);font-family:var(--f-body);font-size:13.5px;font-weight:600;box-shadow:var(--sh-s);transition:all .22s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--violet),var(--mint));box-shadow:0 8px 22px rgba(124,92,240,.36)}

.reshdr{display:flex;align-items:baseline;gap:8px;padding:18px var(--pad) 12px}
.reshdr b{font-family:var(--f-display);font-weight:600;font-size:15px}
.reshdr span{font-size:13px;color:var(--txt-3)}
.reshdr .reset{margin-left:auto;font-size:13.5px;color:var(--violet);cursor:pointer;font-weight:600;border:0;background:none;font-family:var(--f-body);padding:4px 0}
.reshdr .reset[hidden]{display:none}

/* ══════════════════════════════════════════════════════════════
   ПУНКТ 2 · СКОЛЬКО КАРТОЧЕК ПОМЕЩАЕТСЯ В ОДИН РЯД
   Цифра внутри repeat(ЦИФРА,1fr) — это количество карточек.
   ══════════════════════════════════════════════════════════════ */
.grid{
  display:grid;gap:13px;padding:0 var(--pad);
  grid-template-columns:repeat(2,1fr);                 /* НА ТЕЛЕФОНЕ — 2 штуки */
}
@media(min-width:680px){
  .grid{grid-template-columns:repeat(3,1fr);gap:16px}  /* НА ПЛАНШЕТЕ — 3 штуки */
}
@media(min-width:1000px){
  .grid{grid-template-columns:repeat(4,1fr);gap:18px}  /* НА КОМПЬЮТЕРЕ — 4 штуки */
}

/* ---------- Карточка ---------- */
.card{position:relative;border-radius:var(--r-m);overflow:hidden;cursor:pointer;background:var(--card-2);border:1px solid var(--stroke);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh-s);transition:transform .28s var(--ease),border-color .28s,box-shadow .28s;animation:pop .42s var(--ease) both}
.card:active{transform:scale(.975)}
@media(hover:hover){.card:hover{transform:translateY(-3px);border-color:var(--stroke-2);box-shadow:var(--sh-m)}}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.media{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--stroke)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;position:relative;background:linear-gradient(150deg,var(--c1),var(--c2))}
.ph::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 1px,transparent 1px 24px),repeating-linear-gradient(0deg,rgba(255,255,255,.2) 0 1px,transparent 1px 24px)}
.ph b{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--ph-txt);text-shadow:0 2px 14px rgba(0,0,0,.22);z-index:1}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.34) 62%,rgba(0,0,0,.78) 100%)}

.fav{position:absolute;top:9px;right:9px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;color:#fff;transition:transform .2s var(--ease),color .2s}
.fav:active{transform:scale(.82)}
.fav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.fav.on{color:#FF5C9E}
.fav.on svg{fill:currentColor}

/* Имя и цена поверх фото */
.ident{position:absolute;left:12px;right:12px;bottom:11px;z-index:1}
.ident .nm{display:flex;align-items:center;gap:5px;min-width:0}
.ident h3{font-family:var(--f-display);font-weight:600;font-size:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.ident .price{margin-top:4px;font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.ident .price span{font-size:12.5px;font-weight:500;opacity:.85}

.body{padding:12px 13px 14px}
.spec{font-size:12.5px;font-weight:500;color:var(--txt-2);display:flex;flex-wrap:wrap;gap:2px 9px}
.spec s{text-decoration:none;color:var(--txt-3);font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}

/* ══════════════════════════════════════════════════════════════
   ПУНКТ 3.2 · ЦВЕТА ПЛАШЕК СПЕЦИАЛИЗАЦИЙ
   Семь готовых цветов: t1 фиолетовый, t2 бирюзовый, t3 розовый,
   t4 жёлтый, t5 красный, t6 синий, t7 зелёный.
   Какой специализации какой цвет — задаётся ниже в скрипте.
   ══════════════════════════════════════════════════════════════ */
.tag{padding:5px 10px;border-radius:9px;font-size:11.5px;font-weight:600;border:1px solid}
.tag.t1{background:#EEE9FE;border-color:#D0C2FC;color:#5B3FD1}
.tag.t2{background:#DFF7F4;border-color:#A9E9E0;color:#0D7A6E}
.tag.t3{background:#FDE7F1;border-color:#F9C2DC;color:#BE2A72}
.tag.t4{background:#FEF3D7;border-color:#FBE0A0;color:#A16207}
.tag.t5{background:#FEE6E6;border-color:#FBC0C0;color:#C22B2B}
.tag.t6{background:#E3EDFE;border-color:#BBD3FB;color:#1D5FD1}
.tag.t7{background:#E4F7E0;border-color:#BCE9B2;color:#3A7D28}

html[data-theme="dark"] .tag.t1{background:rgba(124,92,240,.24);border-color:rgba(124,92,240,.46);color:#C9B7FF}
html[data-theme="dark"] .tag.t2{background:rgba(20,184,166,.22);border-color:rgba(20,184,166,.44);color:#7BE8DA}
html[data-theme="dark"] .tag.t3{background:rgba(236,72,153,.22);border-color:rgba(236,72,153,.44);color:#FBA5CE}
html[data-theme="dark"] .tag.t4{background:rgba(245,158,11,.22);border-color:rgba(245,158,11,.44);color:#FCD46F}
html[data-theme="dark"] .tag.t5{background:rgba(239,68,68,.22);border-color:rgba(239,68,68,.44);color:#FCA5A5}
html[data-theme="dark"] .tag.t6{background:rgba(59,130,246,.22);border-color:rgba(59,130,246,.44);color:#9DC2FB}
html[data-theme="dark"] .tag.t7{background:rgba(34,197,94,.22);border-color:rgba(34,197,94,.44);color:#93E0AC}

/* ---------- Галочка «проверено» ---------- */
.vf{flex:none;width:17px;height:17px;display:block;filter:drop-shadow(0 2px 4px rgba(45,127,249,.5))}
.vf svg{width:100%;height:100%;display:block}
.vf.lg{width:23px;height:23px}

/* ---------- Пусто ---------- */
.empty{padding:64px 28px;text-align:center;grid-column:1/-1}
.empty .ring{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--stroke);background:var(--card);box-shadow:var(--sh-s)}
.empty .ring svg{width:27px;height:27px;color:var(--txt-3)}
.empty h4{font-family:var(--f-display);font-weight:600;font-size:16px;margin-bottom:8px}
.empty p{font-size:14.5px;color:var(--txt-2);max-width:300px;margin:0 auto 20px}
.empty button{padding:13px 26px;border-radius:14px;border:0;cursor:pointer;background:linear-gradient(120deg,var(--violet),var(--mint));color:#fff;font-family:var(--f-body);font-weight:700;font-size:14px}

.skel{border-radius:var(--r-m);overflow:hidden;background:var(--card-2);border:1px solid var(--stroke)}
.skel .m{aspect-ratio:3/4}
.skel .l{height:11px;margin:12px;border-radius:6px}
.skel .m,.skel .l{background:linear-gradient(100deg,var(--stroke) 30%,var(--stroke-2) 50%,var(--stroke) 70%);background-size:220% 100%;animation:shine 1.3s linear infinite}
@keyframes shine{from{background-position:180% 0}to{background-position:-80% 0}}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,13,31,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .34s var(--ease),visibility .34s}
.scrim.on{opacity:1;visibility:visible}

/* ---------- Панели ---------- */
.drawer,.sheet{
  position:fixed;left:0;right:0;bottom:0;
  border-radius:var(--r-l) var(--r-l) 0 0;
  background:var(--panel);
  border-top:1px solid var(--stroke-2);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  box-shadow:0 -20px 60px rgba(15,13,31,.28);
  transform:translateY(101%);transition:transform .44s var(--ease);
  display:flex;flex-direction:column;
}
.drawer{z-index:70;max-height:88vh}
.sheet{z-index:80;height:94vh;overflow:hidden}
.drawer.on,.sheet.on{transform:none}
@media(min-width:1000px){
  .drawer,.sheet{max-width:600px;left:50%;transform:translate(-50%,101%)}
  .drawer.on,.sheet.on{transform:translate(-50%,0)}
}
.grab{width:40px;height:4px;border-radius:99px;background:var(--stroke-2);margin:11px auto 0;flex:none}
.dhdr{display:flex;align-items:center;padding:14px var(--pad) 6px;flex:none}
.dhdr h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin-right:auto}
.dhdr .x{width:36px;height:36px;border-radius:12px;border:1px solid var(--stroke);background:var(--card);color:var(--txt-2);display:grid;place-items:center;cursor:pointer;font-size:18px;line-height:1}

.dbody{overflow-y:auto;padding:8px var(--pad) 18px;flex:1;-webkit-overflow-scrolling:touch}
.fld{margin-top:26px}
.fld:first-child{margin-top:6px}
.lbl{display:flex;align-items:baseline;gap:8px;margin-bottom:15px}
.lbl h4{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-3)}
.lbl output{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--violet);background:var(--stroke);padding:4px 11px;border-radius:8px}

.range{position:relative;height:34px}
.track{position:absolute;top:15px;left:2px;right:2px;height:5px;border-radius:99px;background:var(--stroke)}
.fill{position:absolute;top:0;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--mint))}
.range input{position:absolute;top:7px;left:0;width:100%;height:20px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range input:focus{outline:0}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;border-radius:50%;cursor:grab;background:#fff;border:3px solid var(--violet);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.range input::-moz-range-thumb{pointer-events:auto;width:17px;height:17px;border-radius:50%;cursor:grab;background:#fff;border:3px solid var(--violet)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--txt-3);margin-top:2px}

.sel{position:relative}
.sel select{width:100%;appearance:none;-webkit-appearance:none;cursor:pointer;background:var(--card);border:1px solid var(--stroke);border-radius:15px;color:var(--txt);font-family:var(--f-body);font-size:15px;font-weight:500;padding:15px 42px 15px 16px;outline:0}
.sel option{background:var(--bg);color:var(--txt)}
.sel::after{content:'';position:absolute;right:18px;top:50%;width:7px;height:7px;pointer-events:none;border-right:2px solid var(--txt-3);border-bottom:2px solid var(--txt-3);transform:translateY(-70%) rotate(45deg)}

.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{padding:10px 15px;border-radius:13px;cursor:pointer;font-family:var(--f-body);font-size:13.5px;font-weight:600;background:var(--card);border:1px solid var(--stroke);color:var(--txt-2);transition:all .22s var(--ease)}
.tg:active{transform:scale(.94)}
.tg.on{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--mint),var(--violet))}

.dfoot,.sfoot{flex:none;display:flex;gap:10px;padding:14px var(--pad) calc(16px + var(--safe-bottom));border-top:1px solid var(--stroke);background:var(--panel)}
.btn{border:0;border-radius:16px;cursor:pointer;font-family:var(--f-body);font-weight:700;font-size:15px;padding:16px 20px;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{flex:none;background:var(--card);border:1px solid var(--stroke);color:var(--txt-2)}
.btn.primary{flex:1;color:#fff;background:linear-gradient(120deg,var(--violet),var(--mint))}
.btn.book{flex:1;color:#fff;background:linear-gradient(120deg,var(--rose),var(--violet))}

/* ---------- Профиль ---------- */
.sclose{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:13px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;font-size:19px;line-height:1}
.sbody{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.hero{position:relative;aspect-ratio:4/5;background:var(--stroke)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .veil{background:linear-gradient(180deg,transparent 34%,rgba(0,0,0,.4) 66%,rgba(0,0,0,.82) 100%)}
.hero .name{position:absolute;left:var(--pad);right:var(--pad);bottom:18px;z-index:1}
.hero .name .nm{display:flex;align-items:center;gap:9px}
.hero .name h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.18;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero .name .row{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:14px;color:rgba(255,255,255,.88);flex-wrap:wrap;text-shadow:0 1px 8px rgba(0,0,0,.5)}

.sec{padding:24px var(--pad) 0}
.sec h5{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-3);margin-bottom:13px}
.card-spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:1px;border-radius:var(--r-m);overflow:hidden;background:var(--stroke);border:1px solid var(--stroke)}
.card-spec div{background:var(--panel);padding:16px 8px;text-align:center}
.card-spec b{display:block;font-family:var(--f-display);font-weight:600;font-size:19px;color:var(--txt)}
.card-spec s{display:block;text-decoration:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3);margin-top:5px}
.about{font-size:15.5px;color:var(--txt-2);line-height:1.7}

.priceline{margin:24px var(--pad) 0;padding:18px 20px;border-radius:var(--r-m);display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--stroke-2)}
.priceline .big{font-family:var(--f-display);font-weight:800;font-size:27px;color:var(--txt)}
.priceline s{text-decoration:none;font-size:11.5px;color:var(--txt-3);display:block;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.priceline .min{margin-left:auto;text-align:right;font-size:12.5px;color:var(--txt-2);line-height:1.45}

/* ---------- Отзывы ---------- */
.rv-top{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--stroke);margin-bottom:14px}
.rv-score{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;color:var(--txt)}
.rv-stars{font-size:15px;letter-spacing:2px;color:var(--star)}
.rv-cnt{font-size:13px;color:var(--txt-3);margin-top:3px}

.rv{padding:15px 16px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--stroke);margin-bottom:10px;position:relative}
.rv .h{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.rv .who{font-weight:700;font-size:14.5px}
.rv .st{font-size:13px;letter-spacing:1.5px;color:var(--star)}
.rv .dt{margin-left:auto;font-size:12px;color:var(--txt-3)}
.rv .tx{font-size:14.5px;color:var(--txt-2);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.rv .del{position:absolute;right:10px;bottom:10px;border:0;background:var(--stroke);color:var(--txt-2);border-radius:9px;padding:6px 11px;font-size:12px;font-family:var(--f-body);font-weight:600;cursor:pointer}
.rv .del:active{transform:scale(.94)}

.rv-empty{padding:22px;text-align:center;font-size:14.5px;color:var(--txt-3);border:1px dashed var(--stroke-2);border-radius:var(--r-m);margin-bottom:14px}

.rv-form{padding:16px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--stroke);margin-top:6px}
.rv-form h6{font-size:14.5px;font-weight:700;margin-bottom:12px;color:var(--txt)}
.rv-pick{display:flex;gap:5px;margin-bottom:12px}
.rv-pick button{border:0;background:none;cursor:pointer;font-size:27px;line-height:1;color:var(--stroke-2);padding:0;transition:transform .15s var(--ease)}
.rv-pick button:active{transform:scale(.85)}
.rv-pick button.on{color:var(--star)}
.rv-form input,.rv-form textarea{
  width:100%;background:var(--panel);border:1px solid var(--stroke);border-radius:13px;
  color:var(--txt);font-family:var(--f-body);font-size:15px;padding:13px 14px;outline:0;margin-bottom:10px;
}
.rv-form input:focus,.rv-form textarea:focus{border-color:var(--stroke-2)}
.rv-form textarea{min-height:96px;resize:vertical;line-height:1.55}
.rv-form input::placeholder,.rv-form textarea::placeholder{color:var(--txt-3)}
.rv-send{width:100%;border:0;border-radius:14px;padding:15px;cursor:pointer;font-family:var(--f-body);font-weight:700;font-size:15px;color:#fff;background:linear-gradient(120deg,var(--violet),var(--mint))}
.rv-send:active{transform:scale(.98)}

.toast{position:fixed;left:50%;bottom:calc(26px + var(--safe-bottom));z-index:99;transform:translate(-50%,26px);opacity:0;pointer-events:none;padding:14px 22px;border-radius:15px;max-width:88vw;text-align:center;background:var(--panel);border:1px solid var(--stroke-2);box-shadow:var(--sh-l);font-size:14.5px;font-weight:600;color:var(--txt);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:2px}
</style>
</head>

/* Обезвреживает текст: если кто-то впишет в отзыв программный код,
   он покажется обычными буквами, а не выполнится. */
function esc(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* Превращает значение в число. Мусор заменяет запасным значением. */
function num(v, fallback){ const n = Number(v); return Number.isFinite(n) ? n : (fallback || 0); }
/* Пропускает только ссылки, начинающиеся с https:// */
function safePhoto(u){
  if(typeof u !== 'string') return '';
  return /^https:\/\/[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+$/.test(u) ? u : '';
}

function matches(m, f){
  if(state.favOnly && state.favorites.indexOf(m.id) === -1) return false;
  const q = state.query.trim().toLowerCase();
  if(q && m.name.toLowerCase().indexOf(q) === -1) return false;
  if(m.age < f.ageMin || m.age > f.ageMax) return false;
  if(m.height < f.hMin || m.height > f.hMax) return false;
  if(m.price < f.pMin || m.price > f.pMax) return false;
  for(let i = 0; i < f.tags.length; i++){ if(m.tags.indexOf(f.tags[i]) === -1) return false; }
  for(let j = 0; j < f.skills.length; j++){ if(m.skills.indexOf(f.skills[j]) === -1) return false; }
  return true;
}

function sortList(list, mode){
  const out = list.slice();
  if(mode === 'pa')      out.sort(function(a,b){ return a.price - b.price; });
  else if(mode === 'pd') out.sort(function(a,b){ return b.price - a.price; });
  else if(mode === 'height') out.sort(function(a,b){ return b.height - a.height; });
  else if(mode === 'rating') out.sort(function(a,b){
    const x = avgStars(a), y = avgStars(b);
    if(x === null && y === null) return b.jobs - a.jobs;
    if(x === null) return 1;
    if(y === null) return -1;
    return y - x || allReviews(b).length - allReviews(a).length;
  });
  else out.sort(function(a,b){ return b.jobs - a.jobs; });
  return out;
}

function currentList(){ return sortList(DATA.filter(function(m){ return matches(m, state.filters); }), state.filters.sort); }

  if(f.ageMin !== DEFAULTS.ageMin || f.ageMax !== DEFAULTS.ageMax) n++;

  return n + f.tags.length + f.skills.length;
}

/* ---- Ползунки ---- */
function bindRange(minId, maxId, fillId, outId, format, gap, onChange){
  const a = $(minId), b = $(maxId), fill = $(fillId), out = $(outId);
  const lo = num(a.min, 0), hi = num(a.max, 100), g = gap || 1;
  function paint(){
    const va = num(a.value, lo), vb = num(b.value, hi);
    fill.style.left  = ((va - lo) / (hi - lo) * 100) + '%';
    fill.style.width = Math.max(0, (vb - va) / (hi - lo) * 100) + '%';
    out.textContent = format(va, vb);
  }
  function clamp(who){
    let va = num(a.value, lo), vb = num(b.value, hi);
    if(va > vb - g){
      if(who === 'a'){ va = Math.min(va, hi - g); vb = va + g; }
      else { vb = Math.max(vb, lo + g); va = vb - g; }
      a.value = va; b.value = vb;
    }
    paint();
    onChange(num(a.value, lo), num(b.value, hi));
  }
  a.addEventListener('input', function(){ clamp('a'); haptic('select'); });
  b.addEventListener('input', function(){ clamp('b'); haptic('select'); });
  paint();
  return { set:function(va, vb){ a.value = va; b.value = vb; paint(); } };
}

const ageRange = bindRange('#ageMin','#ageMax','#ageFill','#ageOut', function(x,y){ return x + ' – ' + y + ' лет'; }, 1,
  function(x,y){ state.draft.ageMin = x; state.draft.ageMax = y; refreshApply(); });
const hRange = bindRange('#hMin','#hMax','#hFill','#hOut', function(x,y){ return x + ' – ' + y + ' см'; }, 1,
  function(x,y){ state.draft.hMin = x; state.draft.hMax = y; refreshApply(); });
const pRange = bindRange('#pMin','#pMax','#pFill','#pOut', function(x,y){ return money(x) + ' – ' + money(y) + ' ₽'; }, 500,
  function(x,y){ state.draft.pMin = x; state.draft.pMax = y; refreshApply(); });

$('#fTags').innerHTML   = TAGS.map(function(t){   return '<button class="tg" data-tg="' + esc(t) + '">' + esc(t) + '</button>'; }).join('');
$('#fSkills').innerHTML = SKILLS.map(function(s){ return '<button class="tg" data-sk="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');

function refreshApply(){ $('#applyN').textContent = draftCount(); }

function syncDraftToUI(){
  const d = state.draft;
  ageRange.set(d.ageMin, d.ageMax);
  hRange.set(d.hMin, d.hMax);
  pRange.set(d.pMin, d.pMax);
  $('#fSort').value = d.sort;
  $$('#fTags .tg').forEach(function(el){   el.classList.toggle('on', d.tags.indexOf(el.dataset.tg) !== -1); });
  $$('#fSkills .tg').forEach(function(el){ el.classList.toggle('on', d.skills.indexOf(el.dataset.sk) !== -1); });
  refreshApply();
}

$('#fSort').addEventListener('change', function(e){ state.draft.sort = e.target.value; haptic('select'); refreshApply(); });

function bindToggleGroup(sel, attr, key){
  $(sel).addEventListener('click', function(e){
    const b = e.target.closest('[' + attr + ']');
    if(!b) return;
    const v = b.getAttribute(attr);
    const i = state.draft[key].indexOf(v);
    if(i === -1) state.draft[key].push(v); else state.draft[key].splice(i, 1);
    b.classList.toggle('on'); haptic('light'); refreshApply();
  });
}
bindToggleGroup('#fTags','data-tg','tags');
bindToggleGroup('#fSkills','data-sk','skills');

}
$('#openFilters').addEventListener('click', openDrawer);
$('#closeFilters').addEventListener('click', function(){ closeDrawer(); haptic('light'); });

$('#applyFilters').addEventListener('click', function(){
  state.filters = JSON.parse(JSON.stringify(state.draft));

$('#resetFilters').addEventListener('click', function(){ state.draft = freshFilters(); syncDraftToUI(); haptic('warning'); });

$('#scrim').addEventListener('click', function(){ state.sheetOpen ? closeSheet() : (state.drawerOpen && closeDrawer()); });

/* ---- Поиск ---- */

$('#q').addEventListener('input', function(e){

/* ---- Клики ---- */
grid.addEventListener('click', function(e){

      return;

function toggleFav(id){
  const i = state.favorites.indexOf(id);
  if(i === -1){ state.favorites.push(id); haptic('success'); }
  else { state.favorites.splice(i, 1); haptic('light'); }
  Store.set('favorites', state.favorites);      /* ← сохраняется навсегда */
}

/* ---- Профиль ---- */
function reviewsHTML(m){
  const list = allReviews(m).slice().reverse();
  const avg = avgStars(m);

  let head = '';
  if(avg !== null){
    head =
      '<div class="rv-top">' +
        '<div class="rv-score">' + avg.toFixed(1) + '</div>' +
        '<div><div class="rv-stars">' + starsHTML(avg) + '</div>' +
        '<div class="rv-cnt">' + list.length + ' ' + plural(list.length,'отзыв','отзыва','отзывов') + '</div></div>' +
      '</div>';
  }

  const items = list.length
    ? list.map(function(r){
        const canDel = IS_ADMIN && r.rid.charAt(0) !== 'f';
        return '<div class="rv">' +
          '<div class="h"><span class="who">' + esc(r.who) + '</span>' +
          '<span class="st">' + starsHTML(r.stars) + '</span>' +
          '<span class="dt">' + esc(niceDate(r.date)) + '</span></div>' +
          '<div class="tx">' + esc(r.text) + '</div>' +
          (canDel ? '<button class="del" data-del="' + esc(r.rid) + '">Удалить</button>' : '') +
        '</div>';
      }).join('')
    : '<div class="rv-empty">' + esc(TEXT.noReviews) + '</div>';

  let picker = '';
  for(let i = 1; i <= 5; i++){
    picker += '<button data-star="' + i + '" class="' + (i <= state.newStars ? 'on' : '') + '" aria-label="' + i + '">★</button>';
  }

  const form =
    '<div class="rv-form">' +
      '<h6>Оставить отзыв</h6>' +
      '<div class="rv-pick" id="rvPick">' + picker + '</div>' +
      '<input id="rvWho" type="text" maxlength="50" placeholder="Ваше имя или студия">' +
      '<textarea id="rvText" maxlength="700" placeholder="Как прошла работа?"></textarea>' +
      '<button class="rv-send" id="rvSend">Отправить отзыв</button>' +
    '</div>';

  return '<div class="sec"><h5>Отзывы</h5>' + head + items + form + '</div>';
}

function sheetHTML(m){
  const skillsBlock = m.skills.length
    ? '<div class="sec"><h5>Мастерство</h5><div class="tags">' +
      m.skills.map(function(s){ return '<span class="tag ' + skillClass(s) + '">' + esc(s) + '</span>'; }).join('') +
      '</div></div>' : '';

  return '' +
  '<div class="hero">' + photoHTML(m) + '<div class="veil"></div>' +
    '<div class="name">' +
      '<div class="nm"><h2>' + esc(m.name) + '</h2>' + (m.verified ? CHECK_LG : '') + '</div>' +
      '<div class="row"><span>' + m.jobs + ' ' + plural(m.jobs,'проект','проекта','проектов') + '</span>' +
      (m.verified ? '<span>·</span><span>Проверена модератором</span>' : '') + '</div>' +
    '</div>' +
  '</div>' +

  '<div class="sec"><h5>Данные</h5><div class="card-spec">' +
    '<div><b>' + m.age + '</b><s>возраст</s></div>' +
    '<div><b>' + m.height + '</b><s>рост, см</s></div>' +
    '<div><b>' + m.weight + '</b><s>вес, кг</s></div>' +
    '<div><b>' + m.bust + '</b><s>грудь</s></div>' +
  '</div></div>' +

  '<div class="sec"><h5>Специализация</h5><div class="tags">' +
    m.tags.map(function(t){ return '<span class="tag ' + tagClass(t) + '">' + esc(t) + '</span>'; }).join('') +
  '</div></div>' +

  skillsBlock +

  '<div class="sec"><h5>О профиле</h5><p class="about">' + esc(m.about) + '</p></div>' +

  '<div class="priceline">' +
    '<div><s>ставка</s><div class="big">' + money(m.price) + ' ₽</div></div>' +
    '<div class="min">за час<br>' + esc(TEXT.minShift) + '</div>' +
  '</div>' +

  reviewsHTML(m) +
  '<div style="height:26px"></div>';
}

function findModel(id){
  for(let i = 0; i < DATA.length; i++){ if(DATA[i].id === id) return DATA[i]; }
  return null;
}

function refreshReviewBlock(){
  const m = findModel(state.activeId);
  if(!m || !state.sheetOpen) return;
  const box = $('#sheetBody');
  const keep = box.scrollTop;
  box.innerHTML = sheetHTML(m);
  box.scrollTop = keep;
}

function openSheet(id){
  const m = findModel(id);
  if(!m) return;
  state.activeId = id;
  state.sheetOpen = true;
  state.newStars = 5;
  $('#sheetBody').innerHTML = sheetHTML(m);
  $('#sheetBody').scrollTop = 0;
  updateSheetFavLabel();
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  document.body.classList.add('locked');
  syncBackButton();
  mainButton(true, 'Забронировать · ' + money(m.price) + ' ₽/час', function(){ book(m); });
  haptic('medium');

  /* Догружаем отзывы из облака Telegram */
  Store.get(rvKey(id), reviewStore[id] || [], function(v, fromCloud){
    if(!fromCloud || !Array.isArray(v)) return;
    reviewStore[id] = v.map(cleanReview).filter(Boolean);
    refreshReviewBlock();
  });
}

function closeSheet(){
  state.sheetOpen = false; state.activeId = null;
  $('#sheet').classList.remove('on');
  if(!state.drawerOpen){ $('#scrim').classList.remove('on'); document.body.classList.remove('locked'); }
  mainButton(false); syncBackButton();
}
$('#closeSheet').addEventListener('click', function(){ closeSheet(); haptic('light'); });

/* Все клики внутри профиля */
$('#sheetBody').addEventListener('click', function(e){
  const star = e.target.closest('[data-star]');
  if(star){
    state.newStars = num(star.getAttribute('data-star'), 5);
    $$('#rvPick button').forEach(function(b){
      b.classList.toggle('on', num(b.getAttribute('data-star'), 0) <= state.newStars);
    });
    haptic('light');
    return;
  }
  if(e.target.closest('#rvSend')){ sendReview(); return; }
  const del = e.target.closest('[data-del]');
  if(del){ deleteReview(del.getAttribute('data-del')); return; }
});

function sendReview(){
  const m = findModel(state.activeId);
  if(!m) return;
  const who  = ($('#rvWho')  ? $('#rvWho').value  : '').trim();
  const text = ($('#rvText') ? $('#rvText').value : '').trim();

  if(text.length < 3){ toast('Напишите пару слов об отзыве'); haptic('error'); return; }

  const item = cleanReview({
    rid:  'u' + Date.now() + Math.random().toString(36).slice(2, 6),
    who:  who || 'Гость',
    stars: state.newStars,
    text: text,
    date: new Date().toISOString().slice(0, 10)
  });
  if(!item) return;

  const list = (reviewStore[m.id] || []).slice();
  list.push(item);
  if(list.length > 100) list.shift();
  reviewStore[m.id] = list;
  Store.set(rvKey(m.id), list);          /* ← сохраняется навсегда */

  state.newStars = 5;
  refreshReviewBlock();
  render();
  haptic('success');
  toast('Спасибо! Отзыв добавлен');
}

function deleteReview(rid){
  const m = findModel(state.activeId);
  if(!m || !IS_ADMIN) return;
  const doIt = function(){
    reviewStore[m.id] = (reviewStore[m.id] || []).filter(function(r){ return r.rid !== rid; });
    Store.set(rvKey(m.id), reviewStore[m.id]);
    refreshReviewBlock(); render(); haptic('warning'); toast('Отзыв удалён');
  };
  if(TG && TG.showConfirm){
    try{ TG.showConfirm('Удалить этот отзыв?', function(ok){ if(ok) doIt(); }); return; }catch(e){}
  }
  if(window.confirm('Удалить этот отзыв?')) doIt();
}

function updateSheetFavLabel(){
  const on = state.favorites.indexOf(state.activeId) !== -1;
  $('#sheetFav').textContent = on ? 'В избранном' : 'В избранное';
}
$('#sheetFav').addEventListener('click', function(){
  if(!state.activeId) return;
  toggleFav(state.activeId); updateSheetFavLabel(); render();
});
$('#sheetBook').addEventListener('click', function(){
  const m = findModel(state.activeId);
  if(m) book(m);
});

function book(m){
  haptic('success');
  if(!state.bookings.some(function(b){ return b.id === m.id; })){
    state.bookings.push({ id:m.id, name:m.name, price:m.price });
    Store.set('bookings', state.bookings);
  }
  render();
  try{
    if(TG && typeof TG.sendData === 'function' && TG.initData){
      TG.sendData(JSON.stringify({ action:'booking_request', modelId:m.id, ts:Date.now() }));
      return;
    }
  }catch(e){}
  const msg = m.name + ' — ' + money(m.price) + ' ₽/час.\n' + TEXT.bookedMsg;
  if(TG && TG.showPopup){
    try{ TG.showPopup({ title:'Заявка отправлена', message:msg, buttons:[{type:'ok'}] }); return; }catch(e){}
  }
  toast('Заявка отправлена: ' + m.name);
}

/* ---- Кнопки Telegram ---- */
function syncBackButton(){
  if(!TG || !TG.BackButton) return;
  try{ (state.drawerOpen || state.sheetOpen) ? TG.BackButton.show() : TG.BackButton.hide(); }catch(e){}
}
function mainButton(show, text, cb){
  if(!TG || !TG.MainButton) return;
  try{
    if(mainButton._cb){ TG.MainButton.offClick(mainButton._cb); mainButton._cb = null; }
    if(!show){ TG.MainButton.hide(); return; }
    mainButton._cb = cb;
    TG.MainButton.setParams({ text:text, color:'#EC4899', text_color:'#FFFFFF', is_active:true, is_visible:true });
    TG.MainButton.onClick(cb);
  }catch(e){}
}
function onBack(){ if(state.sheetOpen) closeSheet(); else if(state.drawerOpen) closeDrawer(); }
function applyInsets(){
  let top = 0, bottom = 0;
  if(TG){
    const sa = TG.safeAreaInset || {}, ca = TG.contentSafeAreaInset || {};
    top = Math.max(num(sa.top,0), num(ca.top,0));
    bottom = num(sa.bottom,0);
  }
  document.documentElement.style.setProperty('--safe-top', top + 'px');
  document.documentElement.style.setProperty('--safe-bottom', bottom + 'px');
}

let toastTimer = null;
function toast(text){
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

document.addEventListener('keydown', function(e){ if(e.key === 'Escape') onBack(); });

/* ---- Запуск ---- */
function boot(){
  if(TG){
    try{ TG.ready(); }catch(e){}
    try{ TG.expand(); }catch(e){}
    try{ TG.disableVerticalSwipes && TG.disableVerticalSwipes(); }catch(e){}
    try{ TG.enableClosingConfirmation && TG.enableClosingConfirmation(); }catch(e){}
    applyInsets();
    try{
      TG.onEvent('viewportChanged', applyInsets);
      TG.onEvent('safeAreaChanged', applyInsets);
      TG.onEvent('contentSafeAreaChanged', applyInsets);
      TG.onEvent('backButtonClicked', onBack);
    }catch(e){}
  }

  applyTheme(Store.getLocal('theme', 'light'), false);
  Store.get('theme', 'light', function(v, fromCloud){ if(fromCloud) applyTheme(v, false); });

  loadAllReviews();

  grid.innerHTML = Array(6).fill(0).map(function(){
    return '<div class="skel"><div class="m"></div><div class="l"></div><div class="l" style="width:60%"></div></div>';
  }).join('');

  Store.get('favorites', [], function(v){ if(Array.isArray(v)) state.favorites = v.map(function(x){ return num(x,0); }); render(); });
  Store.get('bookings',  [], function(v){ if(Array.isArray(v)) state.bookings  = v.filter(function(x){ return x && typeof x === 'object'; }); render(); });

  setTimeout(function(){ syncDraftToUI(); render(); }, 380);
}

boot();
</script>
